id = "moonshot-cn"
name = "Kimi / Moonshot China"
base_url = "https://api.moonshot.cn"
path = "/v1/users/me/balance"
key_url = "https://platform.kimi.com/console/api-keys"
billing_url = "https://platform.kimi.com/console/account"
credential_help = "Use a mainland-China Kimi API Platform key. This account is billed in CNY and is separate from the international account and Kimi Code."
source = "https://platform.kimi.com/docs/api/balance"

[[response_checks]]
path = "/code"
equals = 0
[[response_checks]]
path = "/status"
equals = true

[balance]
rows = "/data"
currency = "CNY"
remaining = "/available_balance"
