id = "nanogpt-subscription"
name = "NanoGPT Subscription"
base_url = "https://api.nano-gpt.com"
path = "/api/subscription/v1/usage"
key_url = "https://nano-gpt.com/api"
billing_url = "https://nano-gpt.com/usage"
credential_help = "Use a NanoGPT inference API key for this read-only usage route. A usage:read management token uses a separate route and is not interchangeable here. This is subscription allowance, not wallet credit."
source = "https://docs.nano-gpt.com/api-reference/openapi.json"

[[quotas]]
label = "Daily input tokens"
used = "/dailyInputTokens/used"
limit = "/limits/dailyInputTokens"
unit = "input_tokens"
reset_at = "/dailyInputTokens/resetAt"
reset_format = "unix_milliseconds"
unavailable_when = "/dailyInputTokens/degraded"
[[quotas]]
label = "Weekly input tokens"
used = "/weeklyInputTokens/used"
limit = "/limits/weeklyInputTokens"
unit = "input_tokens"
reset_at = "/weeklyInputTokens/resetAt"
reset_format = "unix_milliseconds"
unavailable_when = "/weeklyInputTokens/degraded"
[[quotas]]
label = "Daily images"
used = "/dailyImages/used"
limit = "/limits/dailyImages"
unit = "images"
reset_at = "/dailyImages/resetAt"
reset_format = "unix_milliseconds"
unavailable_when = "/dailyImages/degraded"
