id = "opencode-go"
name = "OpenCode Go"
base_url = "https://opencode.ai"
path = "/zen/go/v1/usage"
key_url = "https://opencode.ai/auth"
billing_url = "https://opencode.ai/auth"
credential_help = "Use your workspace's Go API key. This reports subscription windows, not the Zen credit wallet."
source = "https://github.com/anomalyco/opencode/issues/44189"
