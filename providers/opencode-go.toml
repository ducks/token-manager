[[quotas]]
label = "Rolling"
percent = "/usage/rolling/percent"
reset_at = "/usage/rolling/resetsAt"
[[quotas]]
label = "Weekly"
percent = "/usage/weekly/percent"
reset_at = "/usage/weekly/resetsAt"
[[quotas]]
label = "Monthly"
percent = "/usage/monthly/percent"
reset_at = "/usage/monthly/resetsAt"
