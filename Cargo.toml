[package]
name = "token-manager"
version = "20261127.0.0"
edition = "2024"
rust-version = "1.88"
default-run = "token-manager"
description = "Read-only AI account balances and quotas in your terminal"
license = "MIT"
repository = "https://github.com/ducks/token-manager"
readme = "README.md"

[[bin]]
name = "token-manager"
path = "src/main.rs"

[[bin]]
name = "tm"
path = "src/bin/tm.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rpassword = "7"
rust_decimal = { version = "1", default-features = false, features = ["std"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
